name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Feature branches do not open a PR here as a matter of course, and a workflow
  # that only runs on main tells you about a break after it has landed. This
  # makes a run something you can ask for on any branch.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall vendors the MediaPipe wasm and .task files into public/.
      # It warns rather than failing if the model download is unavailable; the
      # worker falls back to the CDN at runtime in that case.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests and frame-budget benchmark
        run: npm test

      # The parity fixtures are regenerated by the test run. If they changed,
      # training/normalize.py no longer matches src/features/normalize.ts and
      # every trained model is invalid.
      - name: Feature-extraction fixtures are in sync
        run: |
          if ! git diff --quiet -- training/fixtures; then
            echo "::error::Normalization changed but training/fixtures was not committed."
            echo "Run 'npm run gen:fixtures', commit the result, and update training/normalize.py."
            git diff --stat -- training/fixtures
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Bundle size
        run: |
          size=$(du -sk dist/assets/index-*.js | cut -f1)
          echo "main bundle: ${size} KB"
          if [ "$size" -gt 600 ]; then
            echo "::error::Main bundle is ${size} KB, over the 600 KB budget."
            exit 1
          fi

  # The training pipeline had never been executed. It was written on a machine
  # with no Python and against a dataset that does not exist yet, and its own
  # README said "reviewed code, not tested code — expect to fix small things on
  # first run". That is a bad thing to discover on the day someone finally has
  # data.
  #
  # So this job runs the whole chain on synthetic input: train, evaluate,
  # export, and verify the ONNX graph against PyTorch. It catches import errors,
  # shape mismatches, argument drift between scripts, checkpoint keys the
  # exporter does not read, and opset problems — most of what actually breaks on
  # a first run.
  #
  # It proves the plumbing. It says nothing whatsoever about accuracy: the hands
  # are made up. See training/make_smoke_data.py.
  training:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: training/requirements.txt

      # CPU wheels are a fraction of the size of the default CUDA ones, and
      # nothing here needs a GPU. Installed first so the pinned version in
      # requirements.txt is already satisfied.
      - name: Install
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # Cheap, and catches the whole class of "it never ran" failures — a typo
      # in a module nothing imports at test time is still a broken pipeline.
      - name: Every module imports
        run: |
          python -c "
          import importlib
          for m in ['normalize', 'splits', 'models', 'prepare_data', 'train_fingerspell',
                    'train_signs', 'evaluate', 'export_onnx', 'make_smoke_data']:
              importlib.import_module(m)
              print('ok', m)
          "

      # The contract that matters most: feature extraction here must produce
      # exactly what src/features/normalize.ts produces, or every trained model
      # is invalid at inference time. Fixtures are generated from the TypeScript
      # tests and committed; the `check` job above fails if they drift.
      - name: Feature parity with the TypeScript
        run: python test_parity.py

      # --hidden 96 is not the default, and that is the point. Everything
      # downstream rebuilds the architecture from the checkpoint to load the
      # weights into it, so a run at the default width would pass even if the
      # width were being dropped on the way through — which it was. Training a
      # non-default shape is what makes evaluate and export prove they can
      # actually reconstruct what training saved.
      - name: Fingerspell pipeline runs end to end
        run: |
          python make_smoke_data.py --out /tmp/smoke.npz --signers 6 --per-letter 12
          python train_fingerspell.py --data /tmp/smoke.npz --out /tmp/run --epochs 12 --hidden 96
          python evaluate.py --run /tmp/run --data /tmp/smoke.npz --report /tmp/run/report.md
          python export_onnx.py --run /tmp/run --out /tmp/smoke.onnx

      # A separate code path, not a variation on the one above: 64-frame
      # windows, a recurrent model, and an ONNX export with a time axis. It is
      # the more fragile of the two exports and was equally untested.
      - name: Signs pipeline runs end to end
        run: |
          python make_smoke_data.py --out /tmp/signs.npz --task signs --signers 5 --per-letter 6
          python train_signs.py --data /tmp/signs.npz --out /tmp/run-signs --epochs 4 --arch gru --hidden 64
          python evaluate.py --run /tmp/run-signs --data /tmp/signs.npz --report /tmp/run-signs/report.md
          python export_onnx.py --run /tmp/run-signs --out /tmp/smoke-signs.onnx

      # export_onnx.py already refuses to write a graph whose output disagrees
      # with PyTorch. This checks the file it did write is real, and that the
      # smoke model has not leaked into the app.
      - name: Smoke models exported, and did not escape
        run: |
          for f in /tmp/smoke.onnx /tmp/smoke-signs.onnx; do
            test -s "$f" || { echo "::error::No ONNX file at $f."; exit 1; }
            echo "exported $f — $(stat -c%s "$f") bytes"
          done
          dirty=$(git status --porcelain -- ../public/models ../docs)
          if [ -n "$dirty" ]; then
            echo "::error::The smoke run modified tracked files. Synthetic models must never ship."
            echo "$dirty"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-smoke-report
          path: /tmp/run/report.md
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
